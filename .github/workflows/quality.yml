name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stable:
        description: Publish a stable release from main
        type: boolean
        default: false
      version:
        description: Numeric release version (required for stable)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Format, test, lint and assemble
        run: ./gradlew :app:spotlessCheck :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/check_repository.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            adb pull /sdcard/Download/gandroidtools-ui-previews app/build/ui-previews
            adb push app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/gat-shell-probe.apk
            adb shell 'CLASSPATH=/data/local/tmp/gat-shell-probe.apk app_process /system/bin io.github.z2bguoguo.gandroidtools.ShellProbe'
            adb shell rm -f /data/local/tmp/gat-shell-probe.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/ui-previews/
  release:
    needs: [android, docs, secrets, device]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      REQUESTED_VERSION: ${{ inputs.version }}
      STABLE: ${{ inputs.stable || false }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and restore persistent signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing persistent signing secret: $name"
              exit 1
            fi
          done
          version="${REQUESTED_VERSION:-0.2.0}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Use a numeric semantic version'
            exit 1
          fi
          if [ "$STABLE" = true ] && [ -z "$REQUESTED_VERSION" ]; then
            echo '::error::Stable releases require an explicit version'
            exit 1
          fi
          if [ "$STABLE" = true ]; then
            echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=$version-pre.$BUILD_NUMBER" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$version-pre.$BUILD_NUMBER" >> "$GITHUB_ENV"
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve private-key alias using pinned certificate
        run: python3 scripts/prepare_signing_alias.py signing-certificate.sha256
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleRelease
      - name: Verify and publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md release/
          cp app/build/outputs/apk/release/app-release.apk "release/GAndroidTools-$VERSION_NAME.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "release/GAndroidTools-$VERSION_NAME.apk" > release/signature.txt
          python3 scripts/verify_certificate.py release/signature.txt signing-certificate.sha256
          python3 scripts/publish_update.py "release/GAndroidTools-$VERSION_NAME.apk" release/update.json
          (cd release && sha256sum ./*.apk > SHA256SUMS)
          flags=()
          if [ "$STABLE" != true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "GAndroidTools $VERSION_NAME" --generate-notes "${flags[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-update
          path: |
            release/*.apk
            release/update.json
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
  pages:
    needs: [android, docs, secrets, device, release]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: wiki-artifact
      - uses: actions/download-artifact@v4
        with:
          name: signed-update
          path: update-artifact
      - name: Combine wiki and verified update
        run: |
          mkdir -p public/downloads
          tar -xf wiki-artifact/artifact.tar -C public
          cp update-artifact/* public/downloads/
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-complete
          path: public
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-complete
